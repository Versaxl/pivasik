<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Совёнок — Бесконечное Лето Онлайн</title>
<link rel="icon" href="/assets/img/favicon.ico">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/" class="active">Серверы</a>
    <a href="/rules">Правила</a>
    <a href="/news">Новости</a>
    <button id="themeBtn">🌙 Тема</button>
  </nav>

  <header>
    <div class="logo">Совёнок — Лето</div>
    <div class="sub">Добро пожаловать. Снова.</div>
    <div class="meta">
      <span class="dot"></span>
      <span>Серверов онлайн: <b id="totalOnline">—</b></span>
    </div>
  </header>

  <main class="grid" id="grid">
    <p style="color:var(--muted)">Загрузка серверов…</p>
  </main>

  <footer>
    Фан-проект. «Бесконечное лето» и все связанные материалы принадлежат их авторам.
  </footer>
</div>
<script src="/js/app.js"></script>
<!-- Мини-окно с никнеймом -->
<div id="nickModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:100;align-items:center;justify-content:center">
  <div style="background:var(--bg1);border:1px solid var(--border);border-radius:16px;
    padding:28px;max-width:360px;width:90%">
    <h2 style="margin-bottom:12px;font-size:1.2rem">Ваш никнейм</h2>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:14px">
      Нужен для отслеживания активности.
    </p>
    <input id="nickInput" placeholder="Введите ник" style="width:100%;padding:10px;
      border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.2);
      color:var(--text);font:inherit;margin-bottom:12px">
    <button id="nickSave" style="width:100%;padding:10px;border-radius:8px;border:none;
      background:var(--accent);color:#0f1a22;font-weight:700;cursor:pointer">
      Сохранить
    </button>
  </div>
</div>
</body>
</html>
