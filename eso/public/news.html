<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости — Совёнок</title>
<link rel="icon" href="/assets/img/favicon.ico">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/">Серверы</a>
    <a href="/rules">Правила</a>
    <a href="/news" class="active">Новости</a>
    <button id="themeBtn">🌙 Тема</button>
  </nav>

  <div class="page">
    <h1>Новости</h1>
    <div class="content" id="newsList">Загрузка…</div>
  </div>

  <footer>Фан-проект. Все права принадлежат авторам «Бесконечного лета».</footer>
</div>
<script>
  const t = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  };

  fetch('/api/news')
    .then(r => r.json())
    .then(items => {
      document.getElementById('newsList').innerHTML = items.map(n => `
        <div class="news-item">
          <div class="date">${n.date}</div>
          <h3>${n.title}</h3>
          <p>${n.text}</p>
        </div>`).join('');
    });
</script>
</body>
</html>
